<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="data:," />
<title>PROAS V11</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;background:#0f0f0f;color:#fff;margin:0;text-align:center;padding-bottom:196px}
  header{background:#00ff88;color:#000;padding:14px;font-weight:bold;font-size:17px;line-height:1.3}
  #aviso{display:none;background:#2a1503;border:1px solid #7a4a00;color:#ffd9a0;margin:10px 12px 0;padding:10px 12px;border-radius:10px;font-size:14px;line-height:1.45;text-align:left}
  #aviso.visible{display:block}
  video{width:90%;max-width:340px;aspect-ratio:4/3;object-fit:cover;border-radius:14px;margin:10px;border:3px solid #00ff88;background:#000}
  #chat{padding:14px;text-align:left;font-size:17px;line-height:1.5}
  .msg{margin:8px 0;padding:11px 14px;border-radius:12px;background:#222;overflow-wrap:break-word;white-space:pre-wrap}
  .yo{background:#00ff88;color:#000;margin-left:auto;text-align:right}
  .bot{background:#222}
  .btn{padding:13px 12px;margin:5px;border:none;border-radius:12px;background:#00ff88;color:#000;font-weight:bold;font-size:15px;cursor:pointer;min-height:48px}
  .btn:active{opacity:.85}
  .btnProd{background:#333;color:#fff;border:1px solid #00ff88}
  #box{display:flex;padding:10px;gap:6px;background:#111;position:fixed;bottom:76px;left:0;right:0;width:100%;box-sizing:border-box}
  #box input{flex:1;min-width:0;padding:12px;border-radius:12px;border:none;font-size:16px;background:#fff;color:#000}
  .oculto{display:none}
  p.pregunta{margin:14px 10px 6px;font-size:16px;line-height:1.45}
</style>
</head>
<body>
<header>🤖 PROAS V11 - PROAS TECHNO</header>
<p class="pregunta">📷 <b>¿QUIÉN LLEGÓ A TU ISLA?</b><br>Seleccionalo y yo lo atiendo como se debe</p>
<div id="aviso" role="status"></div>
<video id="cam" autoplay playsinline muted></video><br>
<button class="btn" id="btn-cam" type="button">📷 PRENDER CÁMARA</button>

<div id="paso1">
  <button class="btn" data-tipo="senorita" type="button">👩 Señorita</button>
  <button class="btn" data-tipo="senora" type="button">👩‍🦰 Señora</button>
  <button class="btn" data-tipo="don" type="button">👨 Don / Señor</button>
  <button class="btn" data-tipo="chavo" type="button">🧑 Chavo / Wey</button>
  <button class="btn" data-tipo="morro" type="button">🧒 Morro</button>
</div>

<div id="paso2" class="oculto">
  <p class="pregunta">👇 <b>¿QUÉ LE PREGUNTÓ?</b> Pícale y yo respondo:</p>
  <button class="btn btnProd" data-rapido="dispensador" type="button">💧 Dispensador $79</button>
  <button class="btn btnProd" data-rapido="arbolito 199" type="button">🌸 Arbolito Enamora $199</button>
  <button class="btn btnProd" data-rapido="arbolito 299" type="button">🌳 Dulce Hogar $299</button>
  <button class="btn btnProd" data-rapido="R15" type="button">🎮 Consola R15 $499</button>
  <button class="btn btnProd" data-rapido="descuento" type="button">💰 Descuento / 5 piezas</button>
  <button class="btn btnProd" data-rapido="caro" type="button">😬 Está caro</button>
  <button class="btn" id="btn-otro" type="button">🔄 OTRO CLIENTE</button>
</div>

<div id="chat"><div class="msg bot">🤖 <b>ULISES:</b> Hola, soy ULISES de PROAS. Arriba selecciona quién llegó y yo lo atiendo.</div></div>
<div id="box"><input id="texto" placeholder="Escríbele al cliente..." autocomplete="off" aria-label="Escríbele al cliente"><button class="btn" id="btn-enviar" type="button">Enviar</button><button class="btn" id="btn-mic" type="button" aria-label="Hablar por micrófono">🎤</button></div>
<script>
var memoria = {};
try{ memoria = JSON.parse(localStorage.getItem('proas_v11') || localStorage.getItem('proas_v10') || localStorage.getItem('proas_v9') || '{}') || {}; }catch(e){ memoria = {}; }
if(!memoria.dispensador) memoria.dispensador = 79;
if(!memoria.descuento5) memoria.descuento5 = 75;
var tipoCliente = "chavo";
var nombre = "wey";
var stream = null;
function guardar(){ try{ localStorage.setItem('proas_v11', JSON.stringify(memoria)); }catch(e){} }
function escapar(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function mostrarAviso(msg){
  var a=document.getElementById('aviso');
  if(msg){ a.textContent=msg; a.classList.add('visible'); } else { a.textContent=''; a.classList.remove('visible'); }
}
function agregar(t,quien){
  var d=document.createElement('div'); d.className='msg '+quien; d.innerHTML=t;
  document.getElementById('chat').appendChild(d);
  window.scrollTo(0,document.body.scrollHeight);
  if(quien==='bot'){
    try{
      var u=new SpeechSynthesisUtterance(t.replace(/<[^>]*>/g,''));
      u.lang='es-MX'; speechSynthesis.cancel(); speechSynthesis.speak(u);
    }catch(e){}
  }
}
function prenderCam(){
  if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){
    mostrarAviso("Este aparato no deja pedir la cámara aquí. Igual selecciona quién llegó con los botones y lo atiendo como se debe.");
    return;
  }
  mostrarAviso('');
  navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}}).then(function(s){
    stream=s;
    document.getElementById('cam').srcObject=stream;
  }).catch(function(err){
    var n=(err && err.name)||"";
    if(n==="NotAllowedError"||n==="SecurityError"||n==="PermissionDeniedError"){
      mostrarAviso("Falta el permiso de cámara para esta página. En Chrome toca el candado o los 3 puntitos junto a la dirección, entra a Permisos y activa Cámara, luego toca 📷 PRENDER CÁMARA otra vez. Mientras tanto, selecciona quién llegó con los botones.");
    } else if(n==="NotFoundError"||n==="OverconstrainedError"){
      mostrarAviso("No se encontró cámara en este aparato. Selecciona quién llegó con los botones y lo atiendo como se debe.");
    } else {
      mostrarAviso("No se pudo prender la cámara. Intenta de nuevo o selecciona quién llegó con los botones.");
    }
  });
}
function saludar(tipo){
  tipoCliente=tipo;
  mostrarAviso('');
  document.getElementById('paso1').classList.add('oculto');
  document.getElementById('paso2').classList.remove('oculto');
  if(tipo==='senorita'){ nombre="señorita"; agregar("🤖 <b>ULISES:</b> Buenos días señorita, bienvenida a PROAS. ¿Qué anda buscando? Le muestro sin compromiso, con gusto le ayudo. ¿Es para usted o para regalo?",'bot'); }
  if(tipo==='senora'){ nombre="señora"; agregar("🤖 <b>ULISES:</b> Buenos días señora, pásele. ¿Para quién es? Le muestro lo que tenemos, sin compromiso.",'bot'); }
  if(tipo==='don'){ nombre="don"; agregar("🤖 <b>ULISES:</b> ¿Qué tal Don? Pásele, bienvenido. ¿Qué andaba buscando? Aquí lo atendemos como se debe.",'bot'); }
  if(tipo==='chavo'){ nombre="wey"; agregar("🤖 <b>ULISES:</b> ¿Qué onda wey? ¿Qué andas buscando? Pásele, aquí hay de todo. ¿Para ti o para regalo?",'bot'); }
  if(tipo==='morro'){ nombre="campeón"; agregar("🤖 <b>ULISES:</b> ¿Qué onda campeón? ¿Qué buscas? ¿Una consola o qué? Dime y te muestro.",'bot'); }
}
function otroCliente(){
  document.getElementById('paso1').classList.remove('oculto');
  document.getElementById('paso2').classList.add('oculto');
  agregar("🤖 <b>ULISES:</b> Va, ¿quién llegó ahora? Seleccionalo arriba.",'bot');
}
function rapido(texto){
  document.getElementById('texto').value=texto;
  mandar();
}
function mandar(){
  var inp=document.getElementById('texto');
  var texto=inp.value.trim();
  if(!texto) return;
  inp.value="";
  mostrarAviso('');
  agregar("🧑 <b>CLIENTE:</b> "+escapar(texto),'yo');
  var t=texto.toLowerCase();
  if(t.indexOf("me llamo")!==-1){
    var n=texto.replace(/me llamo/gi,"").trim().split(" ")[0];
    if(n) nombre=n.charAt(0).toUpperCase()+n.slice(1);
    agregar("🤖 <b>ULISES:</b> Mucho gusto "+escapar(nombre)+". ¿Qué anda buscando?",'bot'); return;
  }
  if(t.indexOf("dispensador")!==-1){
    if(tipoCliente==='senorita') agregar("🤖 <b>ULISES:</b> Sí señorita, en "+memoria.dispensador+" pesos. Es recargable, muy práctico para su casa. Se lo calo aquí enfrente si gusta.",'bot');
    else if(tipoCliente==='senora') agregar("🤖 <b>ULISES:</b> Sí señora, en "+memoria.dispensador+" pesos. Es recargable con USB, ya no anda cargando el garrafón.",'bot');
    else if(tipoCliente==='don') agregar("🤖 <b>ULISES:</b> Sí Don, en "+memoria.dispensador+" pesos. Recargable, no gasta pilas. Se lo calo aquí mismo.",'bot');
    else agregar("🤖 <b>ULISES:</b> Sí wey, en "+memoria.dispensador+" pesos. Recargable, no gasta pilas. ¿Te lo muestro?",'bot');
    return;
  }
  if(t.indexOf("199")!==-1||t.indexOf("enamora")!==-1){ agregar("🤖 <b>ULISES:</b> Ese es el Arbolito Regalo que ENAMORA, en 199 pesos. Con luz, ideal para regalo. Se ve bien bonito en la noche. ¿Se lo muestro prendido?",'bot'); return; }
  if(t.indexOf("299")!==-1||t.indexOf("dulce")!==-1){ agregar("🤖 <b>ULISES:</b> Ese es el Dulce Hogar, en 299 pesos. Es el de luz blanca, se ve bien bonito en la sala o en el cuarto. ¿Lo quiere ver prendido?",'bot'); return; }
  if(t.indexOf("r15")!==-1){ agregar("🤖 <b>ULISES:</b> Sí tenemos la R15, en 499 pesos. Trae como 20 mil juegos. Se la calo aquí mismo si quiere.",'bot'); return; }
  if(t.indexOf("caro")!==-1){
    if(tipoCliente==='senorita'||tipoCliente==='senora') agregar("🤖 <b>ULISES:</b> Le entiendo, pero este sí es de calidad. Se lo calo aquí enfrente y tiene garantía.",'bot');
    else agregar("🤖 <b>ULISES:</b> Te entiendo wey, pero este sí es calidad. Te lo calo aquí y si falla te lo cambio.",'bot');
    return;
  }
  if(t.indexOf("descuento")!==-1||t.indexOf("5")!==-1){ agregar("🤖 <b>ULISES:</b> Le hago paro. Si se lleva 5, se los dejo en "+memoria.descuento5+" cada uno. O sea "+(memoria.descuento5*5)+" por los 5. ¿Se los aparto?",'bot'); return; }
  if(t.indexOf("me lo llevo")!==-1||t.indexOf("cobras")!==-1){ agregar("🤖 <b>ULISES:</b> Claro que sí, ya se armó. Le cobro aquí mismo. ¿Efectivo, transferencia o QR?",'bot'); return; }
  agregar("🤖 <b>ULISES:</b> Dime, ¿es para su casa, para regalo o para quién es? Y le digo cuál le conviene.",'bot');
}
function escuchar(){
  var Rec=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!Rec){ mostrarAviso("Este navegador no reconoce voz. Ábrelo en Chrome o escríbele abajo, te contesta igual."); return; }
  if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){
    mostrarAviso("Este aparato no deja pedir el micrófono aquí. Escríbele abajo y te contesta igual.");
    return;
  }
  mostrarAviso('');
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){
    s.getTracks().forEach(function(tr){ tr.stop(); });
    var rec=new Rec(); rec.lang='es-MX';
    rec.onresult=function(e){ document.getElementById('texto').value=e.results[0][0].transcript; mandar(); };
    rec.onerror=function(ev){
      var err=(ev && ev.error)||"";
      if(err==="not-allowed"||err==="service-not-allowed"){
        mostrarAviso("Falta el permiso de micrófono para esta página. En Chrome toca el candado o los 3 puntitos junto a la dirección, entra a Permisos y activa Micrófono, luego toca 🎤 otra vez. Mientras tanto, escríbele abajo.");
      } else {
        mostrarAviso("No te escuché, intenta de nuevo o escríbele abajo.");
      }
    };
    try{ rec.start(); }catch(e){}
  }).catch(function(err){
    var n=(err && err.name)||"";
    if(n==="NotAllowedError"||n==="SecurityError"||n==="PermissionDeniedError"){
      mostrarAviso("Chrome no dio el micrófono para esta página. Toca el candado o los 3 puntitos junto a la dirección, entra a Permisos (o Configuración del sitio) y activa Micrófono, luego toca 🎤 otra vez. Mientras tanto, escríbele abajo.");
    } else if(n==="NotFoundError"||n==="OverconstrainedError"){
      mostrarAviso("No se encontró micrófono en este aparato. Escríbele abajo y te contesta igual.");
    } else {
      mostrarAviso("No se pudo prender el micrófono. Intenta de nuevo o escríbele abajo.");
    }
  });
}
document.getElementById('btn-cam').addEventListener('click',prenderCam);
document.getElementById('btn-otro').addEventListener('click',otroCliente);
document.getElementById('btn-enviar').addEventListener('click',function(){ mandar(); });
document.getElementById('btn-mic').addEventListener('click',escuchar);
document.getElementById('texto').addEventListener('keydown',function(e){ if(e.key==='Enter') mandar(); });
var tipoBtns=document.querySelectorAll('#paso1 button[data-tipo]');
for(var i=0;i<tipoBtns.length;i++){
  (function(btn){ btn.addEventListener('click',function(){ saludar(btn.getAttribute('data-tipo')); }); })(tipoBtns[i]);
}
var rapidoBtns=document.querySelectorAll('#paso2 button[data-rapido]');
for(var j=0;j<rapidoBtns.length;j++){
  (function(btn){ btn.addEventListener('click',function(){ rapido(btn.getAttribute('data-rapido')); }); })(rapidoBtns[j]);
}
</script>
</body>
</html>
